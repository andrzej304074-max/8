# Konfiguracja workera publikującego na Vinted dla Render.com
#
# Worker NIE jest stroną WWW — to zadanie uruchamiane cyklicznie (cron job),
# które zagląda do bazy, bierze szkice ogłoszeń i wystawia je przez przeglądarkę.
# Aplikacja (magazyn, AI, statystyki) dalej mieszka na Vercelu.
#
# JAK UŻYĆ:
#   1. Render → New → Blueprint → wskaż to repozytorium.
#   2. Render wykryje ten plik i zaproponuje utworzenie usługi.
#   3. Uzupełnij zmienne oznaczone niżej jako sync:false (wartości wpiszesz ręcznie).
#
# UWAGA: przed pierwszym uruchomieniem zapisz sesję Vinted na swoim komputerze:
#   npm run zapisz-sesje
# Bez tego worker zatrzyma kolejkę i poprosi o odnowienie sesji.

services:
  - type: cronjob
    name: vinted-publisher
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Codziennie o 9:00 UTC (11:00 czasu polskiego latem).
    # Format: minuta godzina dzień miesiąc dzień-tygodnia
    schedule: "0 9 * * *"
    envVars:
      # Baza Turso — te same wartości co na Vercelu.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # MUSI być identyczny jak na Vercelu — z niego wyprowadzany jest klucz,
      # którym odszyfrowywana jest zapisana sesja Vinted.
      - key: SESSION_SECRET
        sync: false
      # Wymagane przez walidację konfiguracji aplikacji.
      - key: APP_PASSWORD
        sync: false
      # Zdjęcia z Vercel Blob (worker musi je pobrać, by wgrać do formularza).
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: APP_TIMEZONE
        value: Europe/Warsaw
